<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3BF"/>
      <stop offset="0.45" stop-color="#F9DC74"/>
      <stop offset="1" stop-color="#F0C93F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>

  <!-- manchas suaves de color -->
  <g filter="url(#soft)">
    <circle cx="590" cy="230" r="170" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="210" cy="600" r="210" fill="#F0C93F" opacity="0.5"/>
    <circle cx="640" cy="640" r="130" fill="#FFD7A8" opacity="0.6"/>
    <circle cx="120" cy="170" r="90" fill="#FFE9B0" opacity="0.7"/>
  </g>

  <!-- órbitas concéntricas: ideas que giran alrededor de un centro -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="400" cy="400" r="110" stroke-width="4" opacity="0.75"/>
    <circle cx="400" cy="400" r="190" stroke-width="3" opacity="0.6" stroke-dasharray="2 16"/>
    <circle cx="400" cy="400" r="275" stroke-width="3" opacity="0.5"/>
    <circle cx="400" cy="400" r="350" stroke-width="2.5" opacity="0.35" stroke-dasharray="1 14"/>
  </g>

  <!-- constelación -->
  <polyline points="150,540 262,452 400,512 538,330 656,396" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <g fill="#FFFFFF">
    <circle cx="150" cy="540" r="9" opacity="0.95"/>
    <circle cx="262" cy="452" r="13" opacity="0.95"/>
    <circle cx="400" cy="512" r="9" opacity="0.95"/>
    <circle cx="538" cy="330" r="15" opacity="0.95"/>
    <circle cx="656" cy="396" r="9" opacity="0.95"/>
  </g>

  <!-- núcleo luminoso -->
  <circle cx="400" cy="400" r="54" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="400" cy="400" r="30" fill="#F0C93F" opacity="0.85"/>

  <!-- destellos -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="205" cy="190" r="6"/>
    <circle cx="330" cy="120" r="4"/>
    <circle cx="690" cy="150" r="7"/>
    <circle cx="560" cy="700" r="5"/>
    <circle cx="120" cy="690" r="6"/>
    <circle cx="715" cy="560" r="4"/>
  </g>

  <!-- ola inferior -->
  <path d="M0 690 C140 640 250 735 400 690 C540 648 650 725 800 676 L800 800 L0 800 Z" fill="#E9B92F" opacity="0.4"/>
  <path d="M0 740 C150 700 280 780 430 735 C580 692 690 770 800 730 L800 800 L0 800 Z" fill="#FFFFFF" opacity="0.28"/>
</svg>
