<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#EEF5FF"/>
      <stop offset="0.45" stop-color="#BBD7F8"/>
      <stop offset="1" stop-color="#7FAEEA"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- manchas suaves: un toque lavanda y celeste -->
  <g filter="url(#soft)">
    <circle cx="660" cy="150" r="150" fill="#CFC7F6" opacity="0.7"/>
    <circle cx="120" cy="300" r="140" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="640" cy="560" r="170" fill="#4C8FE0" opacity="0.25"/>
  </g>

  <!-- resplandor central -->
  <rect width="800" height="800" fill="url(#halo)"/>

  <!-- anillos de calma -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="400" cy="320" r="150" stroke-width="4" opacity="0.8"/>
    <circle cx="400" cy="320" r="215" stroke-width="3" opacity="0.55"/>
    <circle cx="400" cy="320" r="285" stroke-width="2.5" opacity="0.38" stroke-dasharray="2 15"/>
  </g>

  <!-- luna / orbe -->
  <circle cx="400" cy="320" r="104" fill="#FFFFFF" opacity="0.92"/>
  <circle cx="432" cy="302" r="92" fill="#DCEBFC" opacity="0.7"/>

  <!-- estrellas: destellos de cuatro puntas -->
  <g fill="#FFFFFF">
    <path d="M170 160 L178 184 L202 192 L178 200 L170 224 L162 200 L138 192 L162 184 Z" opacity="0.95"/>
    <path d="M640 330 L646 348 L664 354 L646 360 L640 378 L634 360 L616 354 L634 348 Z" opacity="0.9"/>
    <path d="M560 120 L564 132 L576 136 L564 140 L560 152 L556 140 L544 136 L556 132 Z" opacity="0.85"/>
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="250" cy="90" r="4"/>
    <circle cx="90" cy="360" r="5"/>
    <circle cx="710" cy="220" r="5"/>
    <circle cx="300" cy="470" r="3.5"/>
    <circle cx="520" cy="480" r="4"/>
    <circle cx="700" cy="440" r="3.5"/>
  </g>

  <!-- colinas en capas -->
  <path d="M0 560 C130 500 250 600 400 545 C550 490 670 590 800 530 L800 800 L0 800 Z" fill="#9CC4F2" opacity="0.55"/>
  <path d="M0 640 C150 585 270 690 420 635 C570 580 680 675 800 620 L800 800 L0 800 Z" fill="#6FA2E6" opacity="0.6"/>
  <path d="M0 720 C140 675 290 760 430 715 C580 668 690 745 800 705 L800 800 L0 800 Z" fill="#4C8FE0" opacity="0.5"/>
</svg>
